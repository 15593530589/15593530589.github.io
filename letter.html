<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>六一快乐 · 给你的话</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #fff5e6 0%, #ffe0c4 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            color: #3b2a1f;
        }
        .paper {
            max-width: 700px;
            margin: 0 auto;
            background: #fffef7;
            border-radius: 48px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
            padding: 2rem 1.8rem;
            border: 1px solid #ffd89a;
        }
        .emoji {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            text-align: center;
            color: #e67e22;
            margin-bottom: 1.2rem;
        }
        .message {
            background: #fffaf0;
            border-radius: 32px;
            padding: 1.5rem;
            font-size: 1rem;
            line-height: 1.75;
            color: #3e2a1a;
            white-space: pre-wrap;
            word-break: break-word;
            border-left: 5px solid #f7b05e;
        }
        .signature {
            margin-top: 1.8rem;
            text-align: right;
            font-size: 0.85rem;
            color: #c28546;
            border-top: 1px dashed #ffe0b5;
            padding-top: 1rem;
        }
        @media (max-width: 550px) {
            body { padding: 1rem; }
            .paper { padding: 1.3rem; }
            .message { font-size: 0.95rem; padding: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="paper">
    <div class="emoji">🍭🧸🎈</div>
    <h1>六一儿童节快乐</h1>
    <div class="message">
        今天六一儿童节嘛，我知道你课很多的，然后我知道每次你下课回去之后看到我那长长的消息就会崩溃的，其实我也注意到了这一点，就是我话太多了，你每天又这么多的课，回去之后还要看这么多的消息肯定会崩溃的嘛，所以我今天就是想说，即使你课很多可能一天的烦恼也不少，那今天六一儿童节可以吃点糖，或者喝点奶茶，买一些小零食让自己高兴起来嘛，起码今天要像小学生一样无忧无虑的开开心心✧٩(ˊωˋ*)و✧
    </div>
    <div class="signature">
        —— 今天只想你开心
    </div>
</div>
</body>
</html>
